name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # TODO(#11): restore the weekly schedule (cron '17 4 * * 1') in the Task 12
  # PR that creates test-integration/ — until then a scheduled run has no
  # tests to find and fails red every Monday.
jobs:
  unit:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:pack
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
